data_paths:
  root_dir: D:/MyStockData
  raw_data: raw
  factors: factors
  cache: cache
  metadata: metadata.db
storage:
  format: parquet
  compression: snappy
  partition_by: year
  temp_file_strategy: direct
  temp_dir: TEMP
  data_source:
    mode: dual
  query_priority:
    preferred: auto
    fallback: true
  partition_strategy:
    enabled: true
    by_month: true
    path_format: '{base}/{type}/{market}/{year}/{month}/{symbol}.parquet'
  parquet:
    root_dir: Parquet
    structure:
      kline:
        1d: kline/daily
        1w: kline/weekly
        1M: kline/monthly
        1m: kline/1m
        5m: kline/5m
        15m: kline/15m
        30m: kline/30m
        60m: kline/60m
      tick: tick
    naming:
      kline: '{symbol}.parquet'
      tick: '{symbol}.parquet'
update:
  auto_check: true
  update_time: '18:00'
  max_retries: 3
  batch_size: 20
data_sources:
  primary: qmt
  fallback: akshare
  enable_mock: true
markets:
  stocks:
    enabled: true
    patterns:
    - '*.SH'
    - '*.SZ'
    - '*.BJ'
  convertible_bonds:
    enabled: true
    patterns:
    - '*.SH'
    - '*.SZ'
    - '*.BJ'
cache:
  memory_max_mb: 4096
  enable_factor_cache: false
  memory_limit_gb: 16
quality:
  min_trading_days: 200
  check_price_relation: true
  max_change_pct: 20
adjustment:
  enabled: true
  types:
  - none
  - front
  - back
  - geometric_front
  - geometric_back
  default: fivefold
database:
  data_db:
    dbfile: stock_data.duckdb
    description: 物理表数据库（存储实际数据）
    batch_size: 100000
    max_connections: 10
    overwrite_existing: true
  view_db:
    dbfile: stock_views.duckdb
    description: 视图数据库（仅包含视图定义）
    batch_size: 100000
    max_connections: 10
    overwrite_existing: false
download:
  batch_size: 100
  batch_size_1m: 30
  batch_size_5m: 40
  batch_size_15m: 50
  batch_size_30m: 60
  batch_size_60m: 70
  batch_size_tick: 10
  batch_size_1w: 80
  batch_size_1M: 90
  max_workers: 20
  queue_size: 30
  sleep_interval: 0.3
  use_batch_download: true
time_ranges:
  default:
    start_date: '1990-01-01'
    end_date: today
  1d:
    start_date: '1990-01-01'
    end_date: today
  1m:
    start_days: 365
    end_date: today
  5m:
    start_days: 365
    end_date: today
  15m:
    start_days: 365
    end_date: today
  30m:
    start_days: 365
    end_date: today
  60m:
    start_days: 365
    end_date: today
  tick:
    start_days: 31
    end_date: today
  1w:
    start_date: '1990-01-01'
    end_date: today
  1M:
    start_date: '1990-01-01'
    end_date: today
rebuild:
  default_mode: immediate
  show_confirmation: true
  enable_performance_monitoring: true
  error_handling:
    retry_attempts: 3
    retry_delay: 1.0
pause:
  enabled: false
  interval: 50
  duration: 3
performance:
  import_strategy: auto
  memory_limit_gb: 8.0
  batch_processing: true
  batch_size_adaptive: true
  min_batch_size: 500
  max_batch_size: 50000
  parquet:
    row_group_size: 50000
    use_dictionary: true
    compression_level: 5
  duckdb:
    memory_limit: 8GB
    threads: 8
    enable_object_cache: true
  thresholds:
    small_data: 500
    large_data: 250000
    partition_threshold: 500000
resource:
  processing_limit:
    max_symbols_per_batch: 10
    max_records_per_batch: 50000
    reset_interval_symbols: 5
    reset_interval_records: 100000
test:
  enabled: true
  symbols:
    sh:
    - 600000.SH
    - 600016.SH
    - 600019.SH
    - 600028.SH
    - 600030.SH
    - 600036.SH
    - 600048.SH
    - 600050.SH
    - 600104.SH
    - 600519.SH
    sz:
    - 000001.SZ
    - 000002.SZ
    - 000063.SZ
    - 000069.SZ
    - 000100.SZ
    - 000333.SZ
    - 000338.SZ
    - 000651.SZ
    - 000776.SZ
    - 001979.SZ
  daily_stock_count: 20
  other_stock_count: 20
logging:
  level: info
  file: logs/data_manager.log
  detailed: true
  minimal: false
  progress_interval: 10
user_preference:
  query_mode: view
  cache:
    enabled: true
    max_size: 500
    force_disable_on_test: true
